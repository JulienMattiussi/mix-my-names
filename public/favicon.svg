<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#d97706" />
    </linearGradient>
    <filter id="shade" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="1.5" flood-color="#78350f" flood-opacity="0.55" />
    </filter>
  </defs>
  <g filter="url(#shade)">
    <rect x="4" y="4" width="56" height="56" rx="8" fill="url(#box)" stroke="#78350f" stroke-width="3" />
    <g fill="#78350f">
      <circle cx="12" cy="12" r="2.5" />
      <circle cx="52" cy="12" r="2.5" />
      <circle cx="12" cy="52" r="2.5" />
      <circle cx="52" cy="52" r="2.5" />
    </g>
    <text
      x="32"
      y="33"
      text-anchor="middle"
      dominant-baseline="central"
      font-family="Arial, sans-serif"
      font-size="40"
      font-weight="bold"
      fill="#ffffff"
      stroke="#78350f"
      stroke-width="2"
      paint-order="stroke"
    >?</text>
  </g>
</svg>
